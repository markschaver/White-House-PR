<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press Release Archive Viewer</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #2b5797;
    --border: #e3e3e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.25rem;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.15rem; margin: 0 0 .6rem; }
  .controls { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  button.src {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: .4rem .8rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: .85rem;
  }
  button.src[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .meta-line { color: var(--muted); font-size: .8rem; margin-left: auto; }
  main { max-width: 760px; margin: 1.25rem auto; padding: 0 1.25rem; }
  .item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.1rem;
    margin-bottom: .9rem;
  }
  .item h2 { font-size: 1.02rem; margin: 0 0 .35rem; }
  .item h2 a { color: var(--accent); text-decoration: none; }
  .item h2 a:hover { text-decoration: underline; }
  .item .meta { color: var(--muted); font-size: .8rem; margin-bottom: .5rem; }
  .tag {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 .4rem;
    font-size: .72rem;
    margin-left: .3rem;
  }
  .summary { font-size: .92rem; color: #333; }
  .summary img { max-width: 100%; height: auto; }
  details > summary {
    cursor: pointer;
    color: var(--accent);
    font-size: .85rem;
    margin-top: .5rem;
  }
  .full { margin-top: .6rem; padding-top: .6rem; border-top: 1px dashed var(--border); }
  .full img { max-width: 100%; height: auto; }
  .status { color: var(--muted); padding: 2rem 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Press Release Archive Viewer</h1>
    <div class="controls">
      <button class="src" data-src="wh">White House</button>
      <button class="src" data-src="state">State Department</button>
      <span class="meta-line" id="metaLine"></span>
    </div>
  </div>
</header>
<main>
  <div id="list"></div>
  <div class="status" id="status"></div>
</main>

<script>
const SOURCES = {
  wh: {
    label: "White House",
    raw: "https://raw.githubusercontent.com/markschaver/White-House-PR/master/",
  },
  state: {
    label: "State Department",
    raw: "https://raw.githubusercontent.com/markschaver/State-Department-PR/master/",
  },
};

const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const metaEl = document.getElementById("metaLine");

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric",
    hour: "2-digit", minute: "2-digit",
  });
}

function render(items, src) {
  listEl.innerHTML = "";
  for (const it of items) {
    const card = document.createElement("div");
    card.className = "item";

    const tags = (it.categories || [])
      .map(c => `<span class="tag">${escapeHtml(c)}</span>`).join("");

    card.innerHTML = `
      <h2><a href="${escapeAttr(it.link)}" target="_blank" rel="noopener">${escapeHtml(it.title || "Untitled")}</a></h2>
      <div class="meta">${fmtDate(it.published)}${it.author ? " · " + escapeHtml(it.author) : ""}${tags}</div>
      <div class="summary">${it.summary || ""}</div>
      <details>
        <summary>Read full text</summary>
        <div class="full">Loading…</div>
      </details>
    `;

    // Lazy-load the full item JSON (with its large `content`) on expand.
    const details = card.querySelector("details");
    const full = card.querySelector(".full");
    let loaded = false;
    details.addEventListener("toggle", async () => {
      if (!details.open || loaded) return;
      loaded = true;
      try {
        const res = await fetch(SOURCES[src].raw + it.path);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        full.innerHTML = data.content || data.summary || "(no content)";
      } catch (e) {
        loaded = false;
        full.textContent = "Failed to load full text: " + e.message;
      }
    });

    listEl.appendChild(card);
  }
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function escapeAttr(s) {
  return String(s ?? "").replace(/"/g, "&quot;");
}

async function load(src) {
  document.querySelectorAll("button.src").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.src === src));
  listEl.innerHTML = "";
  metaEl.textContent = "";
  statusEl.textContent = "Loading " + SOURCES[src].label + "…";
  try {
    const res = await fetch(SOURCES[src].raw + "index.json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    statusEl.textContent = "";
    metaEl.textContent = `${data.count} items · updated ${fmtDate(data.generated_at)}`;
    render(data.items || [], src);
  } catch (e) {
    statusEl.textContent = "Could not load feed: " + e.message;
  }
}

document.querySelectorAll("button.src").forEach(b =>
  b.addEventListener("click", () => load(b.dataset.src)));

load("wh");
</script>
</body>
</html>
